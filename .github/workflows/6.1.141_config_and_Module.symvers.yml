name: Build SM8650 6.1.141 config and Module.symvers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            unzip \
            aria2 \
            bc \
            bison \
            flex \
            build-essential \
            ccache \
            libssl-dev \
            libelf-dev \
            pahole \
            python3 \
            rsync \
            dwarves

      - name: Download kernel source
        run: |
          mkdir -p kernel_workspace
          cd kernel_workspace

          wget -O kernel.zip \
            "https://github.com/cctv18/android_kernel_common_oneplus_sm8650/archive/refs/heads/oneplus/sm8650_b_16.0.0_oneplus12_6.1.141.zip"

          unzip -q kernel.zip

          SRC_DIR=$(find . -maxdepth 1 -type d \
            -name 'android_kernel_common_oneplus_sm8650-*' \
            | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "找不到内核源码目录"
            exit 1
          fi

          mv "$SRC_DIR" common

      - name: Download LLVM Clang 20
        run: |
          cd kernel_workspace

          wget -O clang.zip \
            "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/clang-r547379.zip"

          mkdir -p clang20
          unzip -q clang.zip -d clang20

          echo "搜索 clang..."

          CLANG_BIN=$(find "$GITHUB_WORKSPACE/kernel_workspace/clang20" \
            -type f \
            -path '*/bin/clang' \
            | head -n 1)

          if [ -z "$CLANG_BIN" ]; then
            echo "错误：找不到 clang"
            find "$GITHUB_WORKSPACE/kernel_workspace/clang20" \
              -maxdepth 5 -type f | head -100
            exit 1
          fi

          CLANG_DIR=$(dirname "$CLANG_BIN")

          echo "CLANG_BIN=$CLANG_BIN"
          echo "CLANG_DIR=$CLANG_DIR"

          echo "$CLANG_DIR" >> "$GITHUB_PATH"

          "$CLANG_BIN" --version

      - name: Generate original GKI config
        working-directory: kernel_workspace/common
        run: |
          set -e

          make \
            O="$GITHUB_WORKSPACE/kernel_workspace/out" \
            LLVM=1 \
            ARCH=arm64 \
            gki_defconfig

          echo
          echo "===== CONFIG CHECK ====="

          grep '^CONFIG_MODULES=' \
            "$GITHUB_WORKSPACE/kernel_workspace/out/.config"

          grep '^CONFIG_MODVERSIONS=' \
            "$GITHUB_WORKSPACE/kernel_workspace/out/.config"

      - name: Prepare kernel
        working-directory: kernel_workspace/common
        run: |
          set -e

          make \
            O="$GITHUB_WORKSPACE/kernel_workspace/out" \
            LLVM=1 \
            ARCH=arm64 \
            modules_prepare

      - name: Build kernel for Module.symvers
        working-directory: kernel_workspace/common
        run: |
          set -e

          make -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/kernel_workspace/out" \
            LLVM=1 \
            ARCH=arm64 \
            KCFLAGS="-Wno-error" \
            vmlinux

      - name: Verify output
        run: |
          set -e

          OUT="$GITHUB_WORKSPACE/kernel_workspace/out"

          echo "===== .config ====="
          ls -lh "$OUT/.config"

          echo
          echo "===== Module.symvers ====="
          ls -lh "$OUT/Module.symvers"

          echo
          echo "===== Module.symvers lines ====="
          wc -l "$OUT/Module.symvers"

          echo
          echo "===== CONFIG ====="
          grep -E \
            '^(CONFIG_MODULES|CONFIG_MODVERSIONS)=' \
            "$OUT/.config"

          echo
          echo "===== FIRST SYMBOLS ====="
          head -10 "$OUT/Module.symvers"

      - name: Collect files
        run: |
          set -e

          mkdir -p result

          cp \
            "$GITHUB_WORKSPACE/kernel_workspace/out/.config" \
            result/.config

          cp \
            "$GITHUB_WORKSPACE/kernel_workspace/out/Module.symvers" \
            result/Module.symvers

          ls -lh result

      - name: Upload .config and Module.symvers
        uses: actions/upload-artifact@v4
        with:
          name: SM8650-6.1.141-config-Module.symvers
          path: result/
