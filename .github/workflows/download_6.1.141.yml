name: 6.1.141 内核源码下载

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  SUB_VERSION: '141'
  KERNEL_NAME: 'android14-11-o-gca13bffobf09'
  KERNEL_REPO: 'cctv18/android_kernel_common_oneplus_sm8650'
  KERNEL_BRANCH: 'oneplus/sm8650_b_16.0.0_oneplus12_6.1.141'

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90

    steps:
      - name: 安装编译依赖
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libssl-dev \
            libdw-dev \
            dwarves \
            python3 \
            rsync \
            cpio \
            kmod \
            zstd

      - name: 检查本机 Clang 20
        shell: bash
        run: |
          set -euo pipefail

          get_major() {
            "$1" --version | sed -n '1s/^[^0-9]*\([0-9][0-9]*\).*/\1/p'
          }

          if command -v clang-20 >/dev/null 2>&1 && command -v ld.lld-20 >/dev/null 2>&1; then
            LLVM_VALUE='-20'
            CLANG_CMD="$(command -v clang-20)"
            LLD_CMD="$(command -v ld.lld-20)"
          elif command -v clang >/dev/null 2>&1 && [ "$(get_major clang)" = '20' ]; then
            LLVM_VALUE='1'
            CLANG_CMD="$(command -v clang)"
            LLD_CMD="$(command -v ld.lld 2>/dev/null || true)"

            if [ -z "$LLD_CMD" ]; then
              echo "错误：Clang 20 存在，但 ld.lld 不存在。"
              exit 1
            fi
          else
            echo "错误：Runner 中没有可用的 Clang 20。"
            echo "当前 clang："
            clang --version 2>/dev/null || true
            echo "当前 ld.lld："
            ld.lld --version 2>/dev/null || true
            exit 1
          fi

          echo "LLVM_VALUE=$LLVM_VALUE" >> "$GITHUB_ENV"
          echo "CLANG_CMD=$CLANG_CMD" >> "$GITHUB_ENV"
          echo "LLD_CMD=$LLD_CMD" >> "$GITHUB_ENV"

          echo "Clang：$CLANG_CMD"
          "$CLANG_CMD" --version | head -n 1
          echo "LLD：$LLD_CMD"
          "$LLD_CMD" --version | head -n 1

      - name: 初始化工作目录
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/kernel_workspace"
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "源码仓库：$KERNEL_REPO"
          echo "源码分支：$KERNEL_BRANCH"
          echo "内核版本：$KERNEL_VERSION.$SUB_VERSION"

      - name: 下载 6.1.141 完整源码
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          SRC_URL="https://github.com/${KERNEL_REPO}/archive/refs/heads/${KERNEL_BRANCH}.tar.gz"

          curl -fL --retry 5 --retry-delay 2 --connect-timeout 30 \
            "$SRC_URL" \
            -o kernel-source.tar.gz

          tar -xzf kernel-source.tar.gz
          rm -f kernel-source.tar.gz

          SRC_DIR="$({
            find . -mindepth 1 -maxdepth 1 -type d \
              -name 'android_kernel_common_oneplus_sm8650-*' \
              -print -quit
          })"

          [ -n "$SRC_DIR" ]
          mv "$SRC_DIR" common

          test -f common/Makefile
          test -f common/Kconfig
          test -f common/arch/arm64/Kconfig
          test -f common/arch/arm64/configs/gki_defconfig
          test -d common/drivers
          test -d common/security
          test -d common/include
          test -d common/scripts

          echo "6.1.141 源码基础检查通过。"

      - name: 删除 ABI 保护并移除 dirty 后缀
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          rm -f common/android/abi_gki_protected_exports_* || true

          if [ -f common/scripts/setlocalversion ]; then
            sed -i 's/ -dirty//g' common/scripts/setlocalversion
          fi

      - name: 配置 LZ4 1.10.0 + Zstd 1.5.7
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"
          mkdir -p assets/zram

          curl -fL --retry 5 \
            "$RAW_BASE/zram_patch/001-lz4.patch" \
            -o assets/zram/001-lz4.patch

          curl -fL --retry 5 \
            "$RAW_BASE/zram_patch/lz4armv8.S" \
            -o assets/zram/lz4armv8.S

          curl -fL --retry 5 \
            "$RAW_BASE/zram_patch/002-zstd.patch" \
            -o assets/zram/002-zstd.patch

          # 001-lz4.patch 包含 lz4armv8.S 的 binary diff。
          # 先放置实际二进制源码文件，再让 git apply 排除这个 binary diff。
          mkdir -p common/lib/lz4/lz4armv8
          cp assets/zram/lz4armv8.S common/lib/lz4/lz4armv8/lz4armv8.S

          cd common

          git apply \
            -p1 \
            --exclude='lib/lz4/lz4armv8/lz4armv8.S' \
            ../assets/zram/001-lz4.patch

          patch \
            -p1 \
            --forward \
            --batch \
            < ../assets/zram/002-zstd.patch

          test -f lib/lz4/lz4armv8/lz4armv8.S

          echo "LZ4 + Zstd 补丁应用完成。"

      - name: 配置三星 SSG IO 调度器
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"

          set_config() {
            local key="$1"
            local value="$2"

            sed -i -E \
              "/^${key}=.*/d;/^# ${key} is not set$/d" \
              "$DEFCONFIG"

            printf '%s\n' "${key}=${value}" >> "$DEFCONFIG"
          }

          set_config CONFIG_MQ_IOSCHED_SSG y
          set_config CONFIG_MQ_IOSCHED_SSG_CGROUP y

      - name: 配置 Baseband Guard
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          curl -fsSL \
            https://raw.githubusercontent.com/cctv18/Baseband-guard/master/setup.sh \
            -o /tmp/baseband-guard-setup.sh

          chmod +x /tmp/baseband-guard-setup.sh
          /tmp/baseband-guard-setup.sh

          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          sed -i -E \
            '/^CONFIG_BBG=.*/d;/^# CONFIG_BBG is not set$/d' \
            "$DEFCONFIG"

          printf '%s\n' 'CONFIG_BBG=y' >> "$DEFCONFIG"

          # Baseband Guard 的 setup 脚本会把这一行加入 security/Kconfig。
          # 显式检查，避免生成悬空 Kconfig 引用后才在 defconfig 阶段失败。
          grep -Fq 'source "security/baseband-guard/Kconfig"' security/Kconfig
          test -e security/baseband-guard/Kconfig
          test -e security/baseband-guard/Makefile
          test -e security/baseband-guard/baseband_guard.c

          echo "Baseband Guard 源码与 Kconfig 检查通过。"

      - name: 应用内核基础配置与 CVE 补丁
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"

          set_config() {
            local key="$1"
            local value="$2"

            sed -i -E \
              "/^${key}=.*/d;/^# ${key} is not set$/d" \
              "$DEFCONFIG"

            printf '%s\n' "${key}=${value}" >> "$DEFCONFIG"
          }

          set_config CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE y
          set_config CONFIG_CC_OPTIMIZE_FOR_SIZE n
          set_config CONFIG_HEADERS_INSTALL n

          mkdir -p assets/base

          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

          curl -fL --retry 5 \
            "$RAW_BASE/other_patch/cve-2026-43499-rtmutex-6.1.patch" \
            -o assets/base/cve-2026-43499-rtmutex-6.1.patch

          cd common

          patch \
            -p1 \
            -F 3 \
            --forward \
            --batch \
            < ../assets/base/cve-2026-43499-rtmutex-6.1.patch

      - name: 生成并验证 GKI 配置
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          rm -rf out

          make \
            O=out \
            ARCH=arm64 \
            LLVM="$LLVM_VALUE" \
            LLVM_IAS=1 \
            gki_defconfig

          test -s out/.config

          echo "=== 关键配置 ==="
          grep -E '^(CONFIG_BBG|CONFIG_MQ_IOSCHED_SSG|CONFIG_MQ_IOSCHED_SSG_CGROUP|CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_LZ4|CONFIG_ZSMALLOC)=' out/.config || true
          grep '^CONFIG_LSM=' out/.config || true

          grep -q '^CONFIG_BBG=y$' out/.config
          grep -q '^CONFIG_MQ_IOSCHED_SSG=y$' out/.config
          grep -q '^CONFIG_MQ_IOSCHED_SSG_CGROUP=y$' out/.config

          LSM_LINE="$(grep '^CONFIG_LSM=' out/.config || true)"
          case "$LSM_LINE" in
            *baseband_guard*)
              echo "CONFIG_LSM 已包含 baseband_guard。"
              ;;
            *)
              echo "错误：CONFIG_LSM 中没有 baseband_guard。"
              echo "实际值：${LSM_LINE:-<empty>}"
              exit 1
              ;;
          esac

          echo "gki_defconfig 验证通过。"

      - name: 编译 Image 和全部模块
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          echo "=== 编译器 ==="
          "$CLANG_CMD" --version | head -n 1
          "$LLD_CMD" --version | head -n 1

          echo "=== 开始编译 Image + modules ==="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM="$LLVM_VALUE" \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            Image modules

          test -f out/arch/arm64/boot/Image

          echo "Image 编译成功："
          ls -lh out/arch/arm64/boot/Image

          echo "模块编译检查："
          test -f out/Module.symvers
          find out -type f -name '*.ko' | head -n 20 || true

          echo "Image + modules 编译验证通过。"

      - name: 生成本地编译脚本
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          cat > build_local.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT_DIR="$(cd "$(dirname "$0")" && pwd)"
          OUT_DIR="${OUT_DIR:-$ROOT_DIR/out}"
          JOBS="${JOBS:-$(nproc)}"

          get_major() {
            "$1" --version | sed -n '1s/^[^0-9]*\([0-9][0-9]*\).*/\1/p'
          }

          if command -v clang-20 >/dev/null 2>&1 && command -v ld.lld-20 >/dev/null 2>&1; then
            LLVM_VALUE='-20'
          elif command -v clang >/dev/null 2>&1 && [ "$(get_major clang)" = '20' ]; then
            LLVM_VALUE='1'
          else
            echo "错误：本机需要 Clang 20。"
            clang --version 2>/dev/null || true
            ld.lld --version 2>/dev/null || true
            exit 1
          fi

          cd "$ROOT_DIR"

          echo "ARCH=arm64"
          echo "LLVM=$LLVM_VALUE"
          echo "OUT_DIR=$OUT_DIR"
          echo "JOBS=$JOBS"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM="$LLVM_VALUE" \
            LLVM_IAS=1 \
            gki_defconfig

          make \
            -j"$JOBS" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM="$LLVM_VALUE" \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            Image modules

          test -f "$OUT_DIR/arch/arm64/boot/Image"

          echo
          echo "编译完成：$OUT_DIR/arch/arm64/boot/Image"
          SCRIPT

          chmod +x build_local.sh

      - name: 转换外部组件软链接为源码目录并清理
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          # Baseband Guard：将 setup.sh 创建的外部软链接转换成真正源码目录。
          if [ -L common/security/baseband-guard ]; then
            rm -f common/security/baseband-guard
          fi

          cp -a common/Baseband-guard common/security/baseband-guard
          rm -rf common/Baseband-guard

          # 删除组件仓库自身的 Git 元数据，保留实际源码。
          rm -rf common/security/baseband-guard/.git

          # 删除临时下载内容和编译输出。
          rm -rf assets
          rm -rf common/out

          test -d common/security/baseband-guard
          test -f common/security/baseband-guard/Kconfig
          test -f common/security/baseband-guard/Makefile
          test -f common/security/baseband-guard/baseband_guard.c

          # 不能存在悬空的 baseband-guard 软链接。
          if [ -L common/security/baseband-guard ]; then
            echo "错误：baseband-guard 仍为软链接。"
            exit 1
          fi

      - name: 生成源码说明
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          cat > common/SOURCE_INFO.txt <<EOF
          Kernel source package
          =====================

          Kernel version : ${KERNEL_VERSION}.${SUB_VERSION}
          Android        : ${ANDROID_VERSION}
          Source repo    : https://github.com/${KERNEL_REPO}
          Source branch  : ${KERNEL_BRANCH}
          Generated by   : ${GITHUB_REPOSITORY}
          Workflow run   : ${GITHUB_RUN_ID}
          Generated time : $(TZ="$TZ" date '+%Y-%m-%d %H:%M:%S %Z')

          Fixed components
          ----------------
          KernelSU       : disabled
          SUSFS          : disabled
          KPM            : disabled
          LZ4 + Zstd     : enabled
          LZ4KD          : disabled
          BBR            : disabled
          Droidspaces    : disabled
          Better Net     : disabled
          SSG            : enabled
          Re-Kernel      : disabled
          Baseband Guard : enabled

          GitHub build verification
          --------------------------
          gki_defconfig : passed
          Image          : passed
          modules        : passed

          Local build
          -----------
          This package does not contain Clang/LLVM or other external toolchains.
          A local Clang 20 toolchain is required.

          Build command:
              ./build_local.sh

          Manual build:
              make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
              make -j\$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image modules
          EOF

      - name: 最终源码完整性检查
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          test -f common/Makefile
          test -f common/Kconfig
          test -f common/arch/arm64/Kconfig
          test -f common/arch/arm64/configs/gki_defconfig
          test -f common/security/Kconfig
          test -f common/security/baseband-guard/Kconfig
          test -f common/security/baseband-guard/Makefile
          test -f common/security/baseband-guard/baseband_guard.c
          test -f common/lib/lz4/lz4armv8/lz4armv8.S
          test -f common/build_local.sh
          test -f common/SOURCE_INFO.txt

          if find common \
            -type d \
            \( -name out -o -name clang20 -o -name build-tools \) \
            -print -quit | grep -q .
          then
            echo "错误：源码包中存在不应包含的构建输出或工具链目录。"
            exit 1
          fi

          if find common \
            -type l \
            -lname '*' \
            -print -quit | grep -q .
          then
            echo "发现源码树中的软链接："
            find common -type l -print
          fi

          du -sh common
          echo "最终源码完整性检查通过。"

      - name: 打包完整源码
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          ARCHIVE="android_kernel_common_sm8650_6.1.141_${KERNEL_NAME}.tar.zst"

          tar \
            --zstd \
            -cf "$ARCHIVE" \
            common

          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

          echo "SOURCE_ARCHIVE=$GITHUB_WORKSPACE/kernel_workspace/$ARCHIVE" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$GITHUB_WORKSPACE/kernel_workspace/$ARCHIVE.sha256" >> "$GITHUB_ENV"

          ls -lh "$ARCHIVE" "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"

      - name: 上传完整源码
        uses: actions/upload-artifact@v7
        with:
          name: kernel-source-6.1.141
          path: ${{ env.SOURCE_ARCHIVE }}
          archive: false
          if-no-files-found: error

      - name: 上传 SHA256
        uses: actions/upload-artifact@v7
        with:
          name: kernel-source-6.1.141-sha256
          path: ${{ env.SOURCE_SHA256 }}
          archive: false
          if-no-files-found: error
