name: 6.1.141 内核源码下载

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  SUB_VERSION: '141'
  KERNEL_NAME: 'android14-11-o-gca13bffobf09'
  KERNEL_REPO: 'cctv18/android_kernel_common_oneplus_sm8650'
  KERNEL_BRANCH: 'oneplus/sm8650_b_16.0.0_oneplus12_6.1.141'

  # Android 官方 Clang 20 / r547379
  CLANG_REVISION: 'r547379'
  CLANG_BRANCH: 'llvm-r547379-release'

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. 编译依赖
      # ============================================================
      - name: 安装编译依赖
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            git \
            patch \
            curl \
            libelf-dev \
            libssl-dev \
            libdw-dev \
            dwarves \
            python3 \
            rsync \
            cpio \
            kmod \
            zstd

      # ============================================================
      # 2. Android Clang 20 r547379
      # ============================================================
      - name: 下载 Android Clang 20 r547379
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_ROOT="$GITHUB_WORKSPACE/toolchains/clang-r547379"

          rm -rf "$TOOLCHAIN_ROOT"
          mkdir -p "$TOOLCHAIN_ROOT"

          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/clang-${CLANG_REVISION}.tar.gz"

          echo "========================================"
          echo "Android Clang"
          echo "========================================"
          echo "Revision : ${CLANG_REVISION}"
          echo "Branch   : ${CLANG_BRANCH}"
          echo "URL      : ${CLANG_URL}"
          echo

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$CLANG_URL" \
            -o "$RUNNER_TEMP/clang-r547379.tar.gz"

          tar \
            -xzf "$RUNNER_TEMP/clang-r547379.tar.gz" \
            -C "$TOOLCHAIN_ROOT"

          rm -f "$RUNNER_TEMP/clang-r547379.tar.gz"

          test -x "$TOOLCHAIN_ROOT/bin/clang"
          test -x "$TOOLCHAIN_ROOT/bin/ld.lld"

          echo "$TOOLCHAIN_ROOT/bin" >> "$GITHUB_PATH"

          # LLVM=目录/
          echo "LLVM_VALUE=$TOOLCHAIN_ROOT/bin/" >> "$GITHUB_ENV"
          echo "CLANG_CMD=$TOOLCHAIN_ROOT/bin/clang" >> "$GITHUB_ENV"
          echo "LLD_CMD=$TOOLCHAIN_ROOT/bin/ld.lld" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "验证 Clang"
          echo "========================================"

          "$TOOLCHAIN_ROOT/bin/clang" --version
          echo
          "$TOOLCHAIN_ROOT/bin/ld.lld" --version

          "$TOOLCHAIN_ROOT/bin/clang" --version \
            | grep -Fq 'clang version 20.0.0'

          "$TOOLCHAIN_ROOT/bin/clang" --version \
            | grep -Fq 'b718bcaf8c198c82f3021447d943401e3ab5bd54'

          "$TOOLCHAIN_ROOT/bin/ld.lld" --version \
            | grep -Fq 'LLD 20.0.0'

          echo
          echo "Android Clang r547379 验证通过。"

      # ============================================================
      # 3. 初始化目录
      # ============================================================
      - name: 初始化工作目录
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/kernel_workspace"

          mkdir -p \
            "$GITHUB_WORKSPACE/kernel_workspace"

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "源码仓库：$KERNEL_REPO"
          echo "源码分支：$KERNEL_BRANCH"
          echo "内核版本：$KERNEL_VERSION.$SUB_VERSION"

      # ============================================================
      # 4. 下载完整源码
      # ============================================================
      - name: 下载 6.1.141 完整源码
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          SRC_URL="https://github.com/${KERNEL_REPO}/archive/refs/heads/${KERNEL_BRANCH}.tar.gz"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            "$SRC_URL" \
            -o kernel-source.tar.gz

          tar \
            -xzf kernel-source.tar.gz

          rm -f kernel-source.tar.gz

          SRC_DIR="$(
            find . \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name 'android_kernel_common_oneplus_sm8650-*' \
              -print \
              -quit
          )"

          test -n "$SRC_DIR"

          mv "$SRC_DIR" common

          echo "========================================"
          echo "源码基础检查"
          echo "========================================"

          test -f common/Makefile
          test -f common/Kconfig
          test -f common/arch/arm64/Kconfig
          test -f common/arch/arm64/configs/gki_defconfig

          test -d common/drivers
          test -d common/security
          test -d common/include
          test -d common/scripts

          echo "6.1.141 源码基础检查通过。"

      # ============================================================
      # 5. 删除 ABI 保护 / dirty
      # ============================================================
      - name: 删除 ABI 保护并移除 dirty 后缀
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          rm -f \
            common/android/abi_gki_protected_exports_* \
            || true

          if [ -f common/scripts/setlocalversion ]; then
            sed -i 's/ -dirty//g' \
              common/scripts/setlocalversion
          fi

      # ============================================================
      # 6. LZ4 + Zstd
      # ============================================================
      - name: 配置 LZ4 1.10.0 + Zstd 1.5.7
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

          mkdir -p assets/zram

          curl -fL \
            --retry 5 \
            "$RAW_BASE/zram_patch/001-lz4.patch" \
            -o assets/zram/001-lz4.patch

          curl -fL \
            --retry 5 \
            "$RAW_BASE/zram_patch/lz4armv8.S" \
            -o assets/zram/lz4armv8.S

          curl -fL \
            --retry 5 \
            "$RAW_BASE/zram_patch/002-zstd.patch" \
            -o assets/zram/002-zstd.patch

          mkdir -p \
            common/lib/lz4/lz4armv8

          cp \
            assets/zram/lz4armv8.S \
            common/lib/lz4/lz4armv8/lz4armv8.S

          cd common

          git apply \
            -p1 \
            --exclude='lib/lz4/lz4armv8/lz4armv8.S' \
            ../assets/zram/001-lz4.patch

          patch \
            -p1 \
            --forward \
            --batch \
            < ../assets/zram/002-zstd.patch

          test -f \
            lib/lz4/lz4armv8/lz4armv8.S

          echo "LZ4 + Zstd 补丁应用完成。"

      # ============================================================
      # 7. SSG
      # ============================================================
      - name: 配置三星 SSG IO 调度器
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"

          set_config() {
            local key="$1"
            local value="$2"

            sed -i -E \
              "/^${key}=.*/d;/^# ${key} is not set$/d" \
              "$DEFCONFIG"

            printf '%s\n' \
              "${key}=${value}" \
              >> "$DEFCONFIG"
          }

          set_config CONFIG_MQ_IOSCHED_SSG y
          set_config CONFIG_MQ_IOSCHED_SSG_CGROUP y

          echo "SSG 配置完成。"

      # ============================================================
      # 8. Baseband Guard
      # ============================================================
      - name: 配置 Baseband Guard
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          curl -fsSL \
            https://raw.githubusercontent.com/cctv18/Baseband-guard/master/setup.sh \
            -o /tmp/baseband-guard-setup.sh

          chmod +x \
            /tmp/baseband-guard-setup.sh

          /tmp/baseband-guard-setup.sh

          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          # BBG
          sed -i -E \
            '/^CONFIG_BBG=.*/d;/^# CONFIG_BBG is not set$/d' \
            "$DEFCONFIG"

          printf '%s\n' \
            'CONFIG_BBG=y' \
            >> "$DEFCONFIG"

          # 不在这里修改 CONFIG_LSM。
          #
          # CONFIG_LSM 是 Kconfig string symbol。
          # 该仓库的 gki_defconfig 原始文件中不存在 CONFIG_LSM，
          # make gki_defconfig 后会生成 Kconfig 默认值。
          #
          # 因此在 gki_defconfig 完成以后，再直接修改 out/.config。
          #
          # 这里只检查 Baseband Guard 源码接入是否成功。

          grep -Fq \
            'source "security/baseband-guard/Kconfig"' \
            security/Kconfig

          grep -Fq \
            'baseband-guard/baseband_guard.o' \
            security/Makefile

          test -e \
            security/baseband-guard/Kconfig

          test -e \
            security/baseband-guard/Makefile

          test -e \
            security/baseband-guard/baseband_guard.c

          echo "Baseband Guard 源码与 Kconfig 检查通过。"

      # ============================================================
      # 9. 其它基础配置 + CVE
      # ============================================================
      - name: 应用内核基础配置与 CVE 补丁
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"

          set_config() {
            local key="$1"
            local value="$2"

            sed -i -E \
              "/^${key}=.*/d;/^# ${key} is not set$/d" \
              "$DEFCONFIG"

            printf '%s\n' \
              "${key}=${value}" \
              >> "$DEFCONFIG"
          }

          set_config \
            CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE \
            y

          set_config \
            CONFIG_CC_OPTIMIZE_FOR_SIZE \
            n

          set_config \
            CONFIG_HEADERS_INSTALL \
            n

          mkdir -p assets/base

          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

          curl -fL \
            --retry 5 \
            "$RAW_BASE/other_patch/cve-2026-43499-rtmutex-6.1.patch" \
            -o assets/base/cve-2026-43499-rtmutex-6.1.patch

          cd common

          patch \
            -p1 \
            -F 3 \
            --forward \
            --batch \
            < ../assets/base/cve-2026-43499-rtmutex-6.1.patch

          echo "基础配置与 CVE 补丁应用完成。"

      # ============================================================
      # 10. gki_defconfig
      # ============================================================
      - name: 生成 GKI 配置
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          rm -rf out

          make \
            O=out \
            ARCH=arm64 \
            LLVM="$LLVM_VALUE" \
            LLVM_IAS=1 \
            gki_defconfig

          test -s \
            out/.config

          echo "gki_defconfig 完成。"

      # ============================================================
      # 11. 强制修正最终 .config
      # ============================================================
      - name: 设置最终 CONFIG_LSM 与关键配置
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          CONFIG="out/.config"

          test -s "$CONFIG"

          echo "========================================"
          echo "修改前 CONFIG_LSM"
          echo "========================================"

          grep '^CONFIG_LSM=' \
            "$CONFIG" || true

          # --------------------------------------------------------
          # 强制设置 CONFIG_LSM
          # --------------------------------------------------------
          LSM_VALUE='landlock,lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard'

          sed -i -E \
            '/^CONFIG_LSM=.*/d;/^# CONFIG_LSM is not set$/d' \
            "$CONFIG"

          printf '%s\n' \
            "CONFIG_LSM=\"${LSM_VALUE}\"" \
            >> "$CONFIG"

          # --------------------------------------------------------
          # 再次确保关键配置没有被 Kconfig 改掉
          # --------------------------------------------------------
          sed -i -E \
            '/^CONFIG_BBG=.*/d;/^# CONFIG_BBG is not set$/d' \
            "$CONFIG"

          printf '%s\n' \
            'CONFIG_BBG=y' \
            >> "$CONFIG"

          sed -i -E \
            '/^CONFIG_MQ_IOSCHED_SSG=.*/d;/^# CONFIG_MQ_IOSCHED_SSG is not set$/d' \
            "$CONFIG"

          printf '%s\n' \
            'CONFIG_MQ_IOSCHED_SSG=y' \
            >> "$CONFIG"

          sed -i -E \
            '/^CONFIG_MQ_IOSCHED_SSG_CGROUP=.*/d;/^# CONFIG_MQ_IOSCHED_SSG_CGROUP is not set$/d' \
            "$CONFIG"

          printf '%s\n' \
            'CONFIG_MQ_IOSCHED_SSG_CGROUP=y' \
            >> "$CONFIG"

          echo
          echo "========================================"
          echo "写入后的关键配置"
          echo "========================================"

          grep -E \
            '^(CONFIG_BBG|CONFIG_MQ_IOSCHED_SSG|CONFIG_MQ_IOSCHED_SSG_CGROUP|CONFIG_LSM)=' \
            "$CONFIG"

      # ============================================================
      # 12. olddefconfig 同步
      # ============================================================
      - name: 同步并验证最终 Kconfig
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          make \
            O=out \
            ARCH=arm64 \
            LLVM="$LLVM_VALUE" \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "========================================"
          echo "最终关键配置"
          echo "========================================"

          grep -E \
            '^(CONFIG_BBG|CONFIG_MQ_IOSCHED_SSG|CONFIG_MQ_IOSCHED_SSG_CGROUP|CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_LZ4|CONFIG_ZSMALLOC)=' \
            out/.config \
            || true

          grep '^CONFIG_LSM=' \
            out/.config

          echo
          echo "========================================"
          echo "验证"
          echo "========================================"

          grep -q \
            '^CONFIG_BBG=y$' \
            out/.config

          grep -q \
            '^CONFIG_MQ_IOSCHED_SSG=y$' \
            out/.config

          grep -q \
            '^CONFIG_MQ_IOSCHED_SSG_CGROUP=y$' \
            out/.config

          LSM_LINE="$(
            grep '^CONFIG_LSM=' \
              out/.config \
              || true
          )"

          case "$LSM_LINE" in
            *baseband_guard*)
              echo "CONFIG_LSM 已包含 baseband_guard。"
              ;;
            *)
              echo "错误：CONFIG_LSM 中没有 baseband_guard。"
              echo "实际值：${LSM_LINE:-<empty>}"
              exit 1
              ;;
          esac

          echo
          echo "最终 GKI 配置验证通过。"

      # ============================================================
      # 13. 云端编译 Image + modules
      # ============================================================
      - name: 云端编译 Image 和全部模块
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          echo "========================================"
          echo "编译器"
          echo "========================================"

          "$CLANG_CMD" \
            --version \
            | head -n 1

          "$LLD_CMD" \
            --version \
            | head -n 1

          echo
          echo "LLVM=$LLVM_VALUE"
          echo "CLANG=$CLANG_CMD"
          echo "LLD=$LLD_CMD"

          echo
          echo "========================================"
          echo "开始云端编译"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM="$LLVM_VALUE" \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            Image modules

          echo
          echo "========================================"
          echo "编译结果"
          echo "========================================"

          test -f \
            out/arch/arm64/boot/Image

          test -f \
            out/Module.symvers

          ls -lh \
            out/arch/arm64/boot/Image

          MODULE_COUNT="$(
            find out \
              -type f \
              -name '*.ko' \
              | wc -l
          )"

          echo "KO 数量：$MODULE_COUNT"

          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "错误：没有生成任何 .ko 模块。"
            exit 1
          fi

          echo
          echo "前 20 个模块："

          find out \
            -type f \
            -name '*.ko' \
            | head -n 20 \
            || true

          echo
          echo "Image + modules 云端编译验证通过。"

      # ============================================================
      # 14. 生成本地编译脚本
      # ============================================================
      - name: 生成本地编译脚本
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          cat > build_local.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT_DIR="$(cd "$(dirname "$0")" && pwd)"
          OUT_DIR="${OUT_DIR:-$ROOT_DIR/out}"
          JOBS="${JOBS:-$(nproc)}"

          get_major() {
            "$1" --version \
              | sed -n '1s/^[^0-9]*\([0-9][0-9]*\).*/\1/p'
          }

          if command -v clang-20 >/dev/null 2>&1 &&
             command -v ld.lld-20 >/dev/null 2>&1
          then
            LLVM_VALUE='-20'

          elif command -v clang >/dev/null 2>&1 &&
               [ "$(get_major clang)" = '20' ]
          then
            LLVM_VALUE='1'

          else
            echo "错误：本机需要 Clang 20。"
            clang --version 2>/dev/null || true
            ld.lld --version 2>/dev/null || true
            exit 1
          fi

          cd "$ROOT_DIR"

          echo "ARCH=arm64"
          echo "LLVM=$LLVM_VALUE"
          echo "OUT_DIR=$OUT_DIR"
          echo "JOBS=$JOBS"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM="$LLVM_VALUE" \
            LLVM_IAS=1 \
            gki_defconfig

          make \
            -j"$JOBS" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM="$LLVM_VALUE" \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            Image modules

          test -f \
            "$OUT_DIR/arch/arm64/boot/Image"

          echo
          echo "编译完成："
          echo "$OUT_DIR/arch/arm64/boot/Image"
          SCRIPT

          chmod +x \
            build_local.sh

      # ============================================================
      # 15. 将 Baseband Guard 软链接转为真实目录
      # ============================================================
      - name: 转换外部组件软链接为源码目录
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          if [ -L common/security/baseband-guard ]; then
            rm -f \
              common/security/baseband-guard
          fi

          cp -a \
            common/Baseband-guard \
            common/security/baseband-guard

          rm -rf \
            common/Baseband-guard

          rm -rf \
            common/security/baseband-guard/.git

          test -d \
            common/security/baseband-guard

          test -f \
            common/security/baseband-guard/Kconfig

          test -f \
            common/security/baseband-guard/Makefile

          test -f \
            common/security/baseband-guard/baseband_guard.c

          if [ -L common/security/baseband-guard ]; then
            echo "错误：baseband-guard 仍为软链接。"
            exit 1
          fi

          echo "Baseband Guard 已转换为完整源码目录。"

      # ============================================================
      # 16. 清理构建输出
      # ============================================================
      - name: 清理编译输出和临时文件
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          rm -rf \
            assets

          rm -rf \
            common/out

          echo "编译输出和临时文件清理完成。"

      # ============================================================
      # 17. SOURCE_INFO
      # ============================================================
      - name: 生成源码说明
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          cat > common/SOURCE_INFO.txt <<EOF
          Kernel source package
          =====================

          Kernel version : ${KERNEL_VERSION}.${SUB_VERSION}
          Android        : ${ANDROID_VERSION}
          Source repo    : https://github.com/${KERNEL_REPO}
          Source branch  : ${KERNEL_BRANCH}
          Generated by   : ${GITHUB_REPOSITORY}
          Workflow run   : ${GITHUB_RUN_ID}
          Generated time : $(TZ="$TZ" date '+%Y-%m-%d %H:%M:%S %Z')

          Cloud compiler
          --------------
          Compiler       : Android Clang 20.0.0
          Clang revision : clang-${CLANG_REVISION}
          Clang branch   : ${CLANG_BRANCH}

          Fixed components
          ----------------
          KernelSU       : disabled
          SUSFS          : disabled
          KPM            : disabled
          LZ4 + Zstd     : enabled
          LZ4KD          : disabled
          BBR            : disabled
          Droidspaces    : disabled
          Better Net     : disabled
          SSG            : enabled
          Re-Kernel      : disabled
          Baseband Guard : enabled

          GitHub cloud build verification
          --------------------------------
          gki_defconfig : passed
          CONFIG_LSM    : baseband_guard verified
          Image         : passed
          modules       : passed

          Local build
          -----------
          This package does not contain Clang/LLVM or other external toolchains.
          A local Clang 20 toolchain is required.

          Build command:
              ./build_local.sh

          Manual build:
              make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
              make -j\$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image modules
          EOF

      # ============================================================
      # 18. 最终完整性检查
      # ============================================================
      - name: 最终源码完整性检查
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "========================================"
          echo "源码完整性检查"
          echo "========================================"

          test -f \
            common/Makefile

          test -f \
            common/Kconfig

          test -f \
            common/arch/arm64/Kconfig

          test -f \
            common/arch/arm64/configs/gki_defconfig

          test -f \
            common/security/Kconfig

          test -f \
            common/security/baseband-guard/Kconfig

          test -f \
            common/security/baseband-guard/Makefile

          test -f \
            common/security/baseband-guard/baseband_guard.c

          test -f \
            common/lib/lz4/lz4armv8/lz4armv8.S

          test -f \
            common/build_local.sh

          test -f \
            common/SOURCE_INFO.txt

          # 不允许残留编译输出 / 工具链目录
          if find common \
            -type d \
            \( \
              -name out \
              -o -name clang20 \
              -o -name clang-r547379 \
              -o -name build-tools \
            \) \
            -print \
            -quit \
            | grep -q .
          then
            echo "错误：源码包中存在不应包含的构建输出或工具链目录。"
            exit 1
          fi

          # 不允许 Baseband Guard 保持软链接
          if [ -L common/security/baseband-guard ]; then
            echo "错误：baseband-guard 仍为软链接。"
            exit 1
          fi

          # 输出仍然存在的其它软链接，但不将其视为错误
          if find common \
            -type l \
            -print \
            -quit \
            | grep -q .
          then
            echo "发现源码树中的软链接："
            find common -type l -print
          fi

          du -sh common

          echo
          echo "最终源码完整性检查通过。"

      # ============================================================
      # 19. 打包
      # ============================================================
      - name: 打包完整源码
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          ARCHIVE="android_kernel_common_sm8650_6.1.141_${KERNEL_NAME}.tar.zst"

          tar \
            --zstd \
            -cf "$ARCHIVE" \
            common

          sha256sum \
            "$ARCHIVE" \
            > "$ARCHIVE.sha256"

          echo \
            "SOURCE_ARCHIVE=$GITHUB_WORKSPACE/kernel_workspace/$ARCHIVE" \
            >> "$GITHUB_ENV"

          echo \
            "SOURCE_SHA256=$GITHUB_WORKSPACE/kernel_workspace/$ARCHIVE.sha256" \
            >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "源码包"
          echo "========================================"

          ls -lh \
            "$ARCHIVE" \
            "$ARCHIVE.sha256"

          echo
          cat "$ARCHIVE.sha256"

      # ============================================================
      # 20. 上传源码
      # ============================================================
      - name: 上传完整源码
        uses: actions/upload-artifact@v7
        with:
          name: kernel-source-6.1.141
          path: ${{ env.SOURCE_ARCHIVE }}
          archive: false
          if-no-files-found: error

      # ============================================================
      # 21. 上传 SHA256
      # ============================================================
      - name: 上传 SHA256
        uses: actions/upload-artifact@v7
        with:
          name: kernel-source-6.1.141-sha256
          path: ${{ env.SOURCE_SHA256 }}
          archive: false
          if-no-files-found: error
