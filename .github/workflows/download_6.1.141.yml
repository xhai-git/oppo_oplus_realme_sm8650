name: 6.1.141 内核源码下载并编译验证

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  SUB_VERSION: '141'
  KERNEL_NAME: 'android14-11-o-gca13bffobf09'
  KERNEL_REPO: 'cctv18/android_kernel_common_oneplus_sm8650'
  KERNEL_BRANCH: 'oneplus/sm8650_b_16.0.0_oneplus12_6.1.141'

  KSU_TYPE: 'none'
  SUSFS_ENABLE: 'false'
  KPM_ENABLE: 'false'
  LZ4_ENABLE: 'true'
  LZ4KD_ENABLE: 'false'
  BBR_ENABLE: 'false'
  DROIDSPACES_ENABLE: 'false'
  BETTER_NET_ENABLE: 'false'
  SSG_ENABLE: 'true'
  REKERNEL_ENABLE: 'false'
  BASEBAND_GUARD_ENABLE: 'true'
  KERNEL_SUFFIX: ''

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 180

    steps:
      - name: 安装编译依赖
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            cpio \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            zstd \
            dwarves

      - name: 准备LLVM 20
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v clang-20 >/dev/null 2>&1; then
            echo '错误：当前 GitHub Runner 没有 clang-20。'
            clang --version || true
            exit 1
          fi

          LLVM20_BIN="$(dirname "$(readlink -f "$(command -v clang-20)")")"

          test -x "$LLVM20_BIN/clang"
          test -x "$LLVM20_BIN/ld.lld"
          test -x "$LLVM20_BIN/llvm-ar"
          test -x "$LLVM20_BIN/llvm-nm"
          test -x "$LLVM20_BIN/llvm-objcopy"

          echo "LLVM20_BIN=$LLVM20_BIN" >> "$GITHUB_ENV"
          echo "LLVM20_BIN=$LLVM20_BIN"
          echo
          "$LLVM20_BIN/clang" --version | head -n 2
          "$LLVM20_BIN/ld.lld" --version | head -n 1

      - name: 下载完整6.1.141内核源码
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          rm -rf kernel_workspace
          mkdir -p kernel_workspace
          cd kernel_workspace

          SRC_URL="https://github.com/${KERNEL_REPO}/archive/refs/heads/${KERNEL_BRANCH}.tar.gz"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            "$SRC_URL" \
            -o kernel-source.tar.gz

          tar -xzf kernel-source.tar.gz
          rm -f kernel-source.tar.gz

          SRC_DIR="$(find . -mindepth 1 -maxdepth 1 -type d \
            -name 'android_kernel_common_oneplus_sm8650-*' -print -quit)"

          test -n "$SRC_DIR"
          mv "$SRC_DIR" common

          test -f common/Makefile
          test -f common/Kconfig
          test -f common/arch/arm64/Kconfig
          test -f common/arch/arm64/configs/gki_defconfig
          test -d common/arch
          test -d common/drivers
          test -d common/fs
          test -d common/include
          test -d common/init
          test -d common/kernel
          test -d common/lib
          test -d common/mm
          test -d common/net
          test -d common/security
          test -d common/scripts

          echo '完整内核源码基础检查通过。'

      - name: 获取源码提交SHA
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_SHA="$(
            git ls-remote \
              "https://github.com/${KERNEL_REPO}.git" \
              "refs/heads/${KERNEL_BRANCH}" |
            awk 'NR==1 {print $1}'
          )"

          test -n "$KERNEL_SHA"
          echo "KERNEL_SHA=$KERNEL_SHA" >> "$GITHUB_ENV"
          echo "源码提交: $KERNEL_SHA"

      - name: 应用LZ4 1.10.0 + Zstd 1.5.7
        if: env.LZ4_ENABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"
          mkdir -p assets/zram

          curl -fL --retry 5 \
            "$RAW_BASE/zram_patch/001-lz4.patch" \
            -o assets/zram/001-lz4.patch

          curl -fL --retry 5 \
            "$RAW_BASE/zram_patch/lz4armv8.S" \
            -o assets/zram/lz4armv8.S

          curl -fL --retry 5 \
            "$RAW_BASE/zram_patch/002-zstd.patch" \
            -o assets/zram/002-zstd.patch

          # 001-lz4.patch 含有 lz4armv8.S 的 binary diff。
          # 先按补丁最终目录手工放置该文件，再让 git apply 排除 binary diff。
          rm -rf common/lib/lz4/lz4armv8
          mkdir -p common/lib/lz4/lz4armv8
          cp assets/zram/lz4armv8.S common/lib/lz4/lz4armv8/lz4armv8.S

          cd common

          git apply \
            -p1 \
            --exclude='lib/lz4/lz4armv8/lz4armv8.S' \
            ../assets/zram/001-lz4.patch

          git apply \
            -p1 \
            ../assets/zram/002-zstd.patch

          test -f lib/lz4/lz4armv8/lz4armv8.S

          echo 'LZ4 + Zstd 补丁应用完成。'

      - name: 启用SSG IO调度器
        if: env.SSG_ENABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"
          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"

          set_config() {
            local key="$1"
            local value="$2"

            sed -i -E \
              "/^${key}=.*/d;/^# ${key} is not set$/d" \
              "$DEFCONFIG"

            printf '%s\n' "${key}=${value}" >> "$DEFCONFIG"
          }

          set_config CONFIG_MQ_IOSCHED_SSG y
          set_config CONFIG_MQ_IOSCHED_SSG_CGROUP y

      - name: 集成Baseband Guard
        if: env.BASEBAND_GUARD_ENABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          git clone --depth=1 \
            https://github.com/cctv18/Baseband-guard.git \
            Baseband-guard

          test -f Baseband-guard/Kconfig
          test -f Baseband-guard/Makefile
          test -f Baseband-guard/baseband_guard.c

          SECURITY_DIR="common/security"
          BBG_SRC="$PWD/Baseband-guard"
          BBG_DST="$SECURITY_DIR/baseband-guard"

          # 将 Baseband Guard 直接集成到 common/security，最终源码包不依赖包外软链接。
          if ! grep -Fqx 'obj-$(CONFIG_BBG) += baseband-guard/' "$SECURITY_DIR/Makefile"; then
            printf '\nobj-$(CONFIG_BBG) += baseband-guard/\n' >> "$SECURITY_DIR/Makefile"
          fi

          # 直接插入合法的 Kconfig source 语句。
          # 不使用 awk 的多层引号转义，避免生成 source \"...\" 这类非法内容。
          if ! grep -Fqx 'source "security/baseband-guard/Kconfig"' "$SECURITY_DIR/Kconfig"; then
            sed -i '/^endmenu[[:space:]]*$/i source "security/baseband-guard/Kconfig"' "$SECURITY_DIR/Kconfig"
          fi

          test "$(grep -Fxc 'source "security/baseband-guard/Kconfig"' "$SECURITY_DIR/Kconfig")" -eq 1

          # 复制完整 Baseband Guard 源码到最终源码树内部。
          rm -rf "$BBG_DST"
          mkdir -p "$BBG_DST"
          cp -a "$BBG_SRC"/. "$BBG_DST"/
          rm -rf "$BBG_DST/.git"

          # modern LSM / GKI 直接在默认 LSM 列表中加入 baseband_guard。
          sed -i \
            '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' \
            "$SECURITY_DIR/Kconfig"

          rm -rf Baseband-guard

          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"

          set_config() {
            local key="$1"
            local value="$2"

            sed -i -E \
              "/^${key}=.*/d;/^# ${key} is not set$/d" \
              "$DEFCONFIG"

            printf '%s\n' "${key}=${value}" >> "$DEFCONFIG"
          }

          set_config CONFIG_BBG y

          test -d common/security/baseband-guard
          test -f common/security/baseband-guard/Kconfig
          test -f common/security/baseband-guard/Makefile
          test -f common/security/baseband-guard/baseband_guard.c
          grep -q 'security/baseband-guard/Kconfig' common/security/Kconfig
          grep -q 'obj-$(CONFIG_BBG) += baseband-guard/' common/security/Makefile

          echo 'Baseband Guard 集成完成。'

      - name: 固定内核配置
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"
          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"

          set_config() {
            local key="$1"
            local value="$2"

            sed -i -E \
              "/^${key}=.*/d;/^# ${key} is not set$/d" \
              "$DEFCONFIG"

            printf '%s\n' "${key}=${value}" >> "$DEFCONFIG"
          }

          # KernelSU：关闭，不下载/注入任何KSU源码
          set_config CONFIG_KSU n
          set_config CONFIG_KSU_SUSFS n

          # KPM：关闭
          # 不添加 KPM 特有配置。

          # LZ4KD：关闭
          set_config CONFIG_CRYPTO_LZ4K n
          set_config CONFIG_CRYPTO_LZ4KD n

          # BBR / Better Net / Droidspaces / Re-Kernel：关闭
          # 不添加对应功能配置。

          # SSG：固定开启
          set_config CONFIG_MQ_IOSCHED_SSG y
          set_config CONFIG_MQ_IOSCHED_SSG_CGROUP y

          # Baseband Guard：固定开启
          set_config CONFIG_BBG y

          # 已使用的通用配置
          set_config CONFIG_TMPFS_XATTR y
          set_config CONFIG_TMPFS_POSIX_ACL y
          set_config CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE y
          set_config CONFIG_HEADERS_INSTALL n

          sed -i 's/check_defconfig//' common/build.config.gki

          # 固定版本后缀
          set_config CONFIG_LOCALVERSION '"-'"$KERNEL_NAME"'"'

      - name: 最终源码树检查
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          test ! -e common/drivers/kernelsu
          test ! -d KernelSU
          test ! -d KernelSU-Next

          if [ "$LZ4_ENABLE" = 'true' ]; then
            test -f common/lib/lz4/lz4armv8/lz4armv8.S
          fi

          if [ "$BASEBAND_GUARD_ENABLE" = 'true' ]; then
            test -d common/security/baseband-guard
            test -f common/security/baseband-guard/Kconfig
            test -f common/security/baseband-guard/baseband_guard.c
          fi

          while IFS= read -r -d '' link; do
            target="$(readlink "$link")"
            resolved="$(realpath -m "$(dirname "$link")/$target")"

            case "$resolved" in
              "$GITHUB_WORKSPACE/kernel_workspace/common"/*)
                ;;
              *)
                echo "错误：common中发现指向源码树外部的软链接：$link -> $target"
                exit 1
                ;;
            esac
          done < <(find common -type l -print0)

          echo '最终源码树检查通过。'

      - name: 生成最终Kconfig
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"
          export PATH="$LLVM20_BIN:$PATH"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error \
            gki_defconfig

          test -f out/.config
          grep -q '^CONFIG_ARM64=y$' out/.config
          grep -q '^CONFIG_MQ_IOSCHED_SSG=y$' out/.config
          grep -q '^CONFIG_MQ_IOSCHED_SSG_CGROUP=y$' out/.config
          grep -q '^CONFIG_BBG=y$' out/.config
          grep -q '^# CONFIG_KSU is not set$' out/.config || grep -q '^CONFIG_KSU=n$' out/.config

          echo 'gki_defconfig 成功。'

      - name: 实际编译Image验证
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"
          export PATH="$LLVM20_BIN:$PATH"

          echo '开始编译6.1.141 arm64 Image。'

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error \
            Image

          test -f out/arch/arm64/boot/Image
          test -s out/arch/arm64/boot/Image

          echo 'Image 编译成功。'
          ls -lh out/arch/arm64/boot/Image

      - name: 生成本地编译脚本
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          cat > build_local.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT_DIR="$(cd "$(dirname "$0")" && pwd)"
          OUT_DIR="${OUT_DIR:-$ROOT_DIR/out}"
          JOBS="${JOBS:-$(nproc)}"

          # 指定 LLVM/Clang 20 的 bin 目录：
          #   LLVM=/path/to/clang/bin ./build_local.sh
          #
          # 未指定 LLVM 时直接使用 PATH 中的 LLVM 工具。
          if [ -n "${LLVM:-}" ]; then
            LLVM="${LLVM%/}"
            export PATH="$LLVM:$PATH"
          fi

          export ARCH="${ARCH:-arm64}"
          export CROSS_COMPILE="${CROSS_COMPILE:-}"

          cd "$ROOT_DIR"

          echo "ARCH=$ARCH"
          echo "LLVM=${LLVM:-PATH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE:-LLVM integrated tools}"
          echo "OUT_DIR=$OUT_DIR"
          echo "JOBS=$JOBS"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          make \
            -j"$JOBS" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

          test -s "$OUT_DIR/arch/arm64/boot/Image"
          echo "Image: $OUT_DIR/arch/arm64/boot/Image"
          SCRIPT

          chmod +x build_local.sh
          test -x build_local.sh

      - name: 写入源码包说明
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          cat > SOURCE_INFO.txt <<EOF
          Kernel source package
          =====================

          Kernel version : ${KERNEL_VERSION}.${SUB_VERSION}
          Android        : ${ANDROID_VERSION}
          Repository      : https://github.com/${KERNEL_REPO}
          Branch          : ${KERNEL_BRANCH}
          Commit          : ${KERNEL_SHA}
          Generated       : $(TZ="$TZ" date '+%Y-%m-%d %H:%M:%S %Z')

          Fixed components
          ----------------
          KernelSU        : disabled
          SUSFS           : disabled
          KPM             : disabled
          LZ4+Zstd        : enabled
          LZ4KD           : disabled
          BBR             : disabled
          Droidspaces     : disabled
          Better Net      : disabled
          SSG             : enabled
          Re-Kernel       : disabled
          Baseband Guard  : enabled

          Build verification
          ------------------
          gki_defconfig   : PASS
          Image           : PASS
          Image           : out/arch/arm64/boot/Image

          Toolchain
          ---------
          GitHub Actions runner: ubuntu-26.04
          Clang: runner-provided Clang 20
          No downloaded LLVM/Clang archive is included.
          No build-tools archive is included.
          No ccache cache is included.

          Local build
          -----------
          A clean local build needs an arm64-compatible LLVM/Clang 20 toolchain
          and the normal Linux kernel host build dependencies.
          EOF

      - name: 删除编译输出并打包源码
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          rm -rf common/out

          test ! -d common/out
          test -f common/SOURCE_INFO.txt
          test -x common/build_local.sh
          test -f common/Makefile
          test -f common/Kconfig
          test -f common/arch/arm64/configs/gki_defconfig

          ARCHIVE="android_kernel_common_sm8650_${KERNEL_VERSION}.${SUB_VERSION}_${KERNEL_NAME}.tar.zst"

          tar \
            --zstd \
            -cf "$ARCHIVE" \
            common

          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

          echo "ARCHIVE=$GITHUB_WORKSPACE/kernel_workspace/$ARCHIVE" >> "$GITHUB_ENV"
          echo "CHECKSUM=$GITHUB_WORKSPACE/kernel_workspace/$ARCHIVE.sha256" >> "$GITHUB_ENV"

          ls -lh "$ARCHIVE" "$ARCHIVE.sha256"

      - name: 上传内核源码包
        uses: actions/upload-artifact@v7
        with:
          name: kernel-source-6.1.141-${{ github.run_number }}
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

      - name: 上传SHA256校验文件
        uses: actions/upload-artifact@v7
        with:
          name: kernel-source-6.1.141-${{ github.run_number }}-sha256
          path: ${{ env.CHECKSUM }}
          archive: false
          if-no-files-found: error

      - name: 上传SHA256校验文件
        uses: actions/upload-artifact@v7
        with:
          name: kernel-source-sha256-6.1.141-${{ github.run_number }}
          path: ${{ env.CHECKSUM }}
          archive: false
          if-no-files-found: error
